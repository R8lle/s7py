# Windows-Setup (setup.exe) mit gebuendeltem Python und Abhaengigkeiten.
# Nur manuell: Actions → „Windows-Paket“ → Run workflow
# oder: gh workflow run package-windows.yml
name: Windows-Paket

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install
        run: python -m pip install -e ".[dev]" pyinstaller pillow

      - name: Build stamp and icon
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force packaging/build | Out-Null
          python -m s7py.about --stamp
          Get-Content s7py/_build.py
          python packaging/windows/make_icon.py

      - name: PyInstaller
        run: pyinstaller packaging/windows/s7py.spec --distpath dist --workpath packaging/build/work --noconfirm

      - name: Self-test of the packaged program
        timeout-minutes: 3
        shell: pwsh
        run: |
          $p = Start-Process -FilePath dist/s7py/s7py.exe -ArgumentList "--selftest", "$PWD/selftest.txt" -PassThru
          $done = $p.WaitForExit(120000)
          if (-not $done) { Stop-Process -Id $p.Id -Force; Write-Host "ABGEBROCHEN nach 2 Minuten" }
          if (Test-Path selftest.txt) { Get-Content selftest.txt } else { Write-Host "keine selftest.txt" }
          if (-not $done -or $p.ExitCode -ne 0) { throw "Selbsttest fehlgeschlagen" }

      - name: Installer (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          $version = python -c "import s7py; print(s7py.__version__)"
          & $iscc "/DAppVersion=$version" packaging/windows/installer.iss
          Get-ChildItem dist/installer

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s7py-windows-setup
          path: |
            dist/installer/*.exe
            selftest.txt
          retention-days: 30

      - name: Publish GitHub Release
        if: success()
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = python -c "import s7py; print(s7py.__version__)"
          $tag = "v$version-windows"
          $setup = Get-ChildItem dist/installer/s7py-*-setup.exe | Select-Object -First 1
          if (-not $setup) { throw "Setup-EXE fehlt" }
          gh release view $tag 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $setup.FullName --clobber
          } else {
            gh release create $tag $setup.FullName --title "s7py $version Windows" --notes "Windows-Setup ohne Kommandozeile. Doppelklick auf die EXE, fertig. Optional Desktop-Verknuepfung im Assistenten."
          }
