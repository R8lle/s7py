# Linux-Paket: Tarball + .deb (Ubuntu/Debian). Nur manuell:
# Actions → „Linux-Paket“ → Run workflow
# oder: gh workflow run package-linux.yml
name: Linux-Paket

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: System libraries (Tk/matplotlib + dpkg)
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk libgl1 libxkbcommon0 libfontconfig1 dpkg-dev

      - name: Install
        run: python -m pip install -e ".[dev,opcua,build]"

      - name: Build stamp
        run: |
          mkdir -p packaging/build
          python -m s7py.about --stamp
          cat s7py/_build.py || true

      - name: PyInstaller
        run: |
          pyinstaller packaging/linux/s7py.spec \
            --distpath dist \
            --workpath packaging/build/work \
            --noconfirm

      - name: Self-test of the packaged program
        timeout-minutes: 3
        run: |
          ./dist/s7py/s7py --selftest "$PWD/selftest.txt"
          cat selftest.txt
          grep -q "SELFTEST OK" selftest.txt

      - name: Pack tarball
        run: |
          VERSION="$(python -c 'import s7py; print(s7py.__version__)')"
          ARCH="$(uname -m)"
          OUT="dist/s7py-${VERSION}-linux-${ARCH}.tar.gz"
          tar -C dist -czf "$OUT" s7py
          ls -la "$OUT"

      - name: Build .deb
        run: |
          chmod +x packaging/linux/build-deb.sh
          ./packaging/linux/build-deb.sh
          ls -la dist/*.deb

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: s7py-linux-packages
          path: |
            dist/s7py-*-linux-*.tar.gz
            dist/s7py_*.deb
            selftest.txt
          retention-days: 30

      - name: Publish GitHub Release
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(python -c 'import s7py; print(s7py.__version__)')"
          TAG="v${VERSION}-linux"
          TARBALL="$(ls dist/s7py-*-linux-*.tar.gz | head -1)"
          DEB="$(ls dist/s7py_*.deb | head -1)"
          if [[ -z "$TARBALL" || -z "$DEB" ]]; then echo "Paket fehlt"; exit 1; fi
          NOTES="$(cat <<EOF
          Linux-Pakete fuer Ubuntu/Debian.

          **Empfohlen (.deb):**
          \`\`\`bash
          sudo apt install ./s7py_${VERSION}_amd64.deb
          s7py
          \`\`\`
          Deinstallieren: \`sudo apt remove s7py\`

          **Portabel (tar.gz):** entpacken und \`./s7py\` starten.

          Grafische Oberflaeche noetig (Display).
          EOF
          )"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$TARBALL" "$DEB" --clobber
          else
            gh release create "$TAG" "$TARBALL" "$DEB" \
              --title "s7py ${VERSION} Linux" \
              --notes "$NOTES"
          fi
