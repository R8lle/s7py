# Wird nur von tests.yml aufgerufen.
name: Tests on one OS

on:
  workflow_call:
    inputs:
      os: { type: string, required: true }
      pytest_args: { type: string, default: "" }

jobs:
  test:
    runs-on: ${{ inputs.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: System libraries (Linux, Tk/matplotlib)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-tk libgl1 libxkbcommon0 libfontconfig1

      - name: Install
        run: python -m pip install -e ".[dev,opcua]"

      - name: Tests
        run: python -m pytest -q ${{ inputs.pytest_args }}

      - name: Self-test entry point
        run: python -m s7py --selftest selftest-src.txt && cat selftest-src.txt
