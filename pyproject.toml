[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "s7py"
version = "0.9.0"
description = "SPS-Daten lesen (Snap7/OPC UA), in SQLite speichern und live diagrammieren"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE", "LICENSE_THIRD_PARTY.txt"]
authors = [{ name = "R@lle" }]
dependencies = [
    "matplotlib>=3.8",
    "python-snap7==3.0.0",
]

[project.optional-dependencies]
build = ["pyinstaller>=6.0"]
opcua = ["asyncua>=1.0"]
dev = ["pytest>=8.0"]

[project.urls]
Homepage = "https://github.com/R8lle/s7py"
Repository = "https://github.com/R8lle/s7py"
Issues = "https://github.com/R8lle/s7py/issues"

[project.scripts]
s7py = "s7py.__main__:main"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["s7py*"]

[tool.setuptools.package-data]
s7py = ["help/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
